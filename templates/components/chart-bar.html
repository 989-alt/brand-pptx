<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>Chart — Column (CSS, editable)</title>
<link rel="stylesheet" href="base.css">
<!-- GCB Column: one category's time series. Each .bar is a <div> → EDITABLE
     pptx shape. Set bar height INLINE (% of the 300px plot). Highlight the
     current/last bar with .is-focus. Chart IS the visual — no photo. -->
<style>
  .chart-body { flex: 1; display: flex; flex-direction: column; gap: 24px; padding-top: 28px; }
  .chart-head { display: flex; flex-direction: column; gap: 8px; }
  .plot { height: 300px; }
  .bar-col .val { text-align: center; }
  .bar-col .val p { font-family: var(--ff-display); font-weight: 700; font-size: 16px; }
  .bar-axis { display: flex; gap: 16px; }
  .bar-axis > p { flex: 1; text-align: center; }
</style>
</head>
<body>
<section class="slide">
  <div class="top-bar">
    <div class="brand-mark"><div class="brand-sq"></div><p>Linear</p></div>
  </div>

  <div class="chart-body">
    <div class="chart-head">
      <div class="eyebrow-row"><div class="dot"></div><p class="t-eyebrow">분기 매출</p></div>
      <h2 class="t-display-md">4분기에 곡선이 꺾였다.</h2>
    </div>

    <div class="bars plot">
      <div class="bar-col"><div class="val"><p class="muted">₩2.1억</p></div><div class="bar" style="height:38%"></div></div>
      <div class="bar-col"><div class="val"><p class="muted">₩2.6억</p></div><div class="bar" style="height:47%"></div></div>
      <div class="bar-col"><div class="val"><p class="muted">₩3.4억</p></div><div class="bar" style="height:61%"></div></div>
      <div class="bar-col"><div class="val"><p class="muted">₩3.9억</p></div><div class="bar" style="height:70%"></div></div>
      <div class="bar-col"><div class="val"><p class="accent">₩5.2억</p></div><div class="bar is-focus" style="height:92%"></div></div>
    </div>
    <div class="bar-axis">
      <p class="t-body-sm muted">Q1</p>
      <p class="t-body-sm muted">Q2</p>
      <p class="t-body-sm muted">Q3</p>
      <p class="t-body-sm muted">Q4</p>
      <p class="t-body-sm muted">Q5</p>
    </div>
  </div>

  <div class="bottom-bar">
    <p class="t-caption tertiary">Q5 단일 분기 최대 매출</p>
    <p class="t-mono tertiary">chart · column</p>
  </div>
</section>
</body>
</html>
