<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>Chart — Line (native pptx, editable)</title>
<link rel="stylesheet" href="base.css">
<!-- GLN Line: single time-series trend. A line needs diagonals, so it is NOT
     a CSS shape — author a `placeholder` slot and ship a sibling
     slide-NN.charts.json; build_pptx.js drops a NATIVE pptxgenjs line chart in.
     The inline <svg> below is a BROWSER-ONLY preview (html2pptx ignores it).
     Copy chart-line.charts.json → slide-NN.charts.json next to your slide. -->
<style>
  .chart-body { flex: 1; display: flex; flex-direction: column; gap: 24px; padding-top: 28px; }
  .chart-head { display: flex; flex-direction: column; gap: 8px; }
  .plot-wrap { flex: 1; }
  .chart-slot { height: 100%; padding: 16px; }
  .chart-slot svg { width: 100%; height: 100%; display: block; }
</style>
</head>
<body>
<section class="slide">
  <div class="top-bar">
    <div class="brand-mark"><div class="brand-sq"></div><p>Linear</p></div>
  </div>

  <div class="chart-body">
    <div class="chart-head">
      <div class="eyebrow-row"><div class="dot"></div><p class="t-eyebrow">MAU 12개월</p></div>
      <h2 class="t-display-md">우상향은 멈추지 않았다.</h2>
    </div>

    <div class="plot-wrap">
      <!-- native chart lands here (slide-NN.charts.json). svg = browser preview only -->
      <div class="placeholder chart-slot" id="chart-line">
        <svg viewBox="0 0 600 240" preserveAspectRatio="none" fill="none">
          <polyline points="10,210 120,190 230,150 340,160 450,90 590,30"
                    stroke="#5e6ad2" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
        </svg>
      </div>
    </div>
  </div>

  <div class="bottom-bar">
    <p class="t-caption tertiary">12개월 연속 순성장</p>
    <p class="t-mono tertiary">chart · line</p>
  </div>
</section>
</body>
</html>
