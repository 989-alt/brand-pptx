<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>Chart — Horizontal Bar (CSS, editable)</title>
<link rel="stylesheet" href="base.css">
<!-- GHB Horizontal Bar: ranking with long labels. track + fill are layered
     <div> shapes → EDITABLE. Set .hbar-fill width INLINE (%). Top row .is-focus. -->
<style>
  .chart-body { flex: 1; display: flex; flex-direction: column; gap: 28px; padding-top: 28px; }
  .chart-head { display: flex; flex-direction: column; gap: 8px; }
  .rank-list { gap: 16px; }
  .hbar-row .name { white-space: nowrap; }
  .hbar-row .val p { font-family: var(--ff-display); font-weight: 700; }
</style>
</head>
<body>
<section class="slide">
  <div class="top-bar">
    <div class="brand-mark"><div class="brand-sq"></div><p>Linear</p></div>
  </div>

  <div class="chart-body">
    <div class="chart-head">
      <div class="eyebrow-row"><div class="dot"></div><p class="t-eyebrow">유입 채널 TOP 5</p></div>
      <h2 class="t-display-md">검색이 절반을 끌어온다.</h2>
    </div>

    <div class="hbars rank-list">
      <div class="hbar-row is-focus">
        <p class="t-body name">자연 검색</p>
        <div class="hbar-track"><div class="hbar-fill" style="width:100%"></div></div>
        <div class="val"><p class="accent">48%</p></div>
      </div>
      <div class="hbar-row">
        <p class="t-body name">SNS 광고</p>
        <div class="hbar-track"><div class="hbar-fill" style="width:54%"></div></div>
        <div class="val"><p class="muted">26%</p></div>
      </div>
      <div class="hbar-row">
        <p class="t-body name">추천 · 리퍼럴</p>
        <div class="hbar-track"><div class="hbar-fill" style="width:31%"></div></div>
        <div class="val"><p class="muted">15%</p></div>
      </div>
      <div class="hbar-row">
        <p class="t-body name">이메일</p>
        <div class="hbar-track"><div class="hbar-fill" style="width:16%"></div></div>
        <div class="val"><p class="muted">8%</p></div>
      </div>
      <div class="hbar-row">
        <p class="t-body name">직접 유입</p>
        <div class="hbar-track"><div class="hbar-fill" style="width:6%"></div></div>
        <div class="val"><p class="muted">3%</p></div>
      </div>
    </div>
  </div>

  <div class="bottom-bar">
    <p class="t-caption tertiary">검색·SNS 두 채널이 74%</p>
    <p class="t-mono tertiary">chart · h-bar</p>
  </div>
</section>
</body>
</html>
